# docker compose up --build   ->  Postgres + one-off pipeline run + API (:8000) + Metabase (:3000)
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg2://churn:churn@db:5432/churn_db
  volumes:
    - ./models:/app/models
    - ./reports:/app/reports

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: churn, POSTGRES_PASSWORD: churn, POSTGRES_DB: churn_db }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn_db"]
      interval: 5s
      retries: 10

  pipeline:            # ingest -> EDA -> train -> SHAP -> LTV -> score (exits when done)
    <<: *app
    command: python -m src.pipeline
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: { pipeline: { condition: service_completed_successfully } }

  metabase:
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    environment: { MB_DB_FILE: /metabase-data/metabase.db }
    volumes: [metabase-data:/metabase-data]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  metabase-data:
